name: Node.js CI

on:
    push:
        branches:
            - next
            - graphql
    pull_request:
        branches:
            - next
            - graphql

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        strategy:
            matrix:
                bun-version: [1.2.15]
        steps:
            # expect used for unbuffer
            - name: Install Native Dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install expect

            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Bun ${{ matrix.bun-version }}
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ matrix.bun-version }}

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Compile
              run: |
                  unbuffer yarn build | tee yarn_output.log
                  if cat yarn_output.log | grep build.chunkSizeWarningLimit; then
                    echo "Detected chunk size warning peer dependencies!"
                    exit 1
                  fi

    lint:
        name: Run Linter
        runs-on: ubuntu-latest
        strategy:
            matrix:
                bun-version: [1.2.15]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Bun ${{ matrix.bun-version }}
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ matrix.bun-version }}

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Run ESLint
              run: bun eslint "**/*.{js,jsx,ts,tsx}"

            - name: Run Prettier
              run: bun prettier -c .
